# pnpm 10+ blocks dependency postinstall scripts unless they are listed here.
#
# All three need theirs:
#   - sharp — native image pipeline used by next/image optimisation. Without
#     its binaries Next falls back or fails at runtime on image routes.
#   - esbuild — downloads its platform binary; Vitest will not run without it.
#   - unrs-resolver — native resolver used by the ESLint import plugin.
#
# Leaving these unanswered also makes `pnpm install` exit non-zero, which fails
# any CI step that chains commands with `&&`.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# pnpm holds back releases younger than its minimum release age, a defence
# against hijacked third-party packages. @luvngift/shared is our own package,
# published only by us, and must be installable the moment it is published;
# listing versions one by one meant every new release was blocked
# ("max version is 4.0.0") until someone added it here.

minimumReleaseAgeExclude:
  - '@luvngift/shared@4.1.0'
